<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="lexBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lexBeam" x1="4" y1="10" x2="28" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="lexBlue" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Plaque -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="url(#lexBg)" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Central Justice Pillar -->
  <path d="M16 6.5 L17.5 9 L16.8 21.5 L15.2 21.5 L14.5 9 Z" fill="url(#lexBeam)"/>
  
  <!-- Apex Diamond -->
  <polygon points="16,4.8 18.2,7.2 16,9.6 13.8,7.2" fill="url(#lexBlue)"/>
  
  <!-- Balance Beam with Subtle Arc -->
  <path d="M6.5 11 C11 9.8 21 9.8 25.5 11" stroke="url(#lexBeam)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Left Scale Pan (Geometric) -->
  <path d="M6.5 11 L4.5 17 L10.5 17 Z" fill="url(#lexBlue)" opacity="0.95"/>
  <path d="M4.5 17 Q7.5 19.5 10.5 17" stroke="#93c5fd" stroke-width="1" fill="none"/>
  
  <!-- Right Scale Pan (Geometric) -->
  <path d="M25.5 11 L21.5 17 L27.5 17 Z" fill="url(#lexBlue)" opacity="0.95"/>
  <path d="M21.5 17 Q24.5 19.5 27.5 17" stroke="#93c5fd" stroke-width="1" fill="none"/>
  
  <!-- Foundation Pedestal -->
  <path d="M11.5 22.5 L20.5 22.5 L22 25 L10 25 Z" fill="url(#lexBeam)"/>
</svg>
